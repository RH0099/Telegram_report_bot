name: Continuous Telegram Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # এর ফলে আপনি নিজেও বাটন চেপে টেস্ট করতে পারবেন
  schedule:
    - cron: '0 */5 * * *'
  workflow_run:
    workflows: ["Continuous Telegram Bot"]
    types:
      - completed

jobs:
  run-bot:
    runs-on: ubuntu-latest
    
    concurrency:
      group: telegram-247-bot
      cancel-in-progress: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20' # এখানে আগে টাইপো বা ভুল ছিল, এখন ঠিক করা হয়েছে
        cache: 'npm'

    - name: Install Dependencies
      run: |
        echo '{"name":"tg-assistant","version":"1.0.0","dependencies":{"telegraf":"^4.16.3"}}' > package.json
        npm install

    - name: Run Assistant Bot (Max Available Time)
      env:
        BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      run: timeout 18000 node index.js || true
      
